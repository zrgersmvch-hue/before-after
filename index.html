<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { overflow-x: hidden; background: #000; }
  .slider {
    position: relative;
    width: 100%;
    height: 2971px;
    user-select: none;
  }
  .slider img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; 
    height: 2971px;
    object-fit: cover;
    pointer-events: none;
  }
  .img-before {
    clip-path: inset(0 50% 0 0);
  }
  .divider {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 3px;
    background: #ffffff;
    cursor: ew-resize;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
  }
  .handle {
    position: sticky;
    top: 50vh;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    background: #ffffff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: sans-serif; font-weight: bold; color: #111;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<div class="slider" id="slider">
  <img src="2.jpg" alt="После">
  <img src="1.jpg" class="img-before" id="beforeImg" alt="До">
  <div class="divider" id="divider">
    <div class="handle">↔</div>
  </div>
</div>

<script>
  const slider = document.getElementById('slider');
  const beforeImg = document.getElementById('beforeImg');
  const divider = document.getElementById('divider');
  let active = false;

  const move = (clientX) => {
    const rect = slider.getBoundingClientRect();
    let x = Math.max(0, Math.min(clientX - rect.left, rect.width));
    let percent = (x / rect.width) * 100;
    beforeImg.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
    divider.style.left = `${percent}%`;
  };

  slider.addEventListener('mousedown', () => active = true);
  window.addEventListener('mouseup', () => active = false);
  window.addEventListener('mousemove', (e) => { if (active) move(e.clientX); });

  slider.addEventListener('touchstart', () => active = true);
  window.addEventListener('touchend', () => active = false);
  window.addEventListener('touchmove', (e) => { if (active) move(e.touches.clientX); });
</script>

</body>
</html>
